<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff7e8"><meta name="description" content="小小商店老闆：給小學生玩的生活理財與投資教育遊戲">
<title>小小商店老闆｜生活理財遊戲</title>
<style>
:root{--ink:#24352d;--muted:#718078;--green:#277455;--lime:#d8f1a5;--paper:#fffdf8;--cream:#fff7e8;--orange:#f2a546;--red:#c84f43;--line:#e9e5da;--shadow:0 12px 32px #28372a12}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:ui-rounded,"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer}.shell{max-width:1080px;margin:auto;padding:22px 20px 40px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:19px}.brand{display:flex;align-items:center;gap:11px;font-weight:900;font-size:19px}.brand-icon{display:grid;place-items:center;width:43px;height:43px;border-radius:15px;background:var(--lime);font-size:24px}.top-note{font-size:13px;color:var(--muted)}.hero{border-radius:26px;padding:27px 30px;background:#e8f3dc;display:flex;align-items:center;justify-content:space-between;overflow:hidden;position:relative;margin-bottom:19px}.hero:after{content:'✦';position:absolute;font-size:150px;color:#fff9;right:25%;top:-53px;transform:rotate(15deg)}.hero-copy{position:relative;z-index:1}.eyebrow{font-size:12px;letter-spacing:.13em;color:var(--green);font-weight:900}.hero h1{font-size:clamp(27px,4vw,40px);line-height:1.2;margin:8px 0}.hero p{margin:0;color:#52675b;max-width:570px;line-height:1.7}.hero-art{z-index:1;font-size:74px;filter:drop-shadow(0 8px 6px #53745122)}.layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(270px,.8fr);gap:18px;align-items:start}.card{background:var(--paper);border:1px solid #eee9dd;border-radius:22px;padding:23px;box-shadow:var(--shadow)}.card h2{font-size:20px;margin:0 0 5px}.sub{color:var(--muted);font-size:13px;line-height:1.55;margin:0 0 18px}.biz-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.biz{border:2px solid var(--line);background:white;border-radius:17px;padding:17px 12px;text-align:left;color:var(--ink);transition:.15s}.biz:hover{transform:translateY(-2px);border-color:#a5c78b}.biz.selected{border-color:var(--green);background:#f1f8e9;box-shadow:0 0 0 3px #27745512}.biz .emoji{font-size:31px;display:block;margin-bottom:8px}.biz strong{display:block;font-size:15px}.biz small{display:block;color:var(--muted);font-size:12px;margin-top:4px}.field{margin-top:18px}.field label{font-weight:800;font-size:14px;display:block;margin-bottom:8px}.field input{width:100%;padding:12px 13px;border-radius:12px;border:1px solid var(--line);background:white;color:var(--ink);outline-color:var(--green)}.btn{border:0;background:var(--green);color:white;font-weight:900;padding:13px 18px;border-radius:13px;box-shadow:0 5px 0 #1c5b40;transition:.12s}.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #1c5b40}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}.btn.secondary{background:#e8f0df;color:var(--green);box-shadow:0 4px 0 #cbd9be}.full{width:100%;margin-top:17px}.rules{background:#fff5d9;border:1px solid #f4e7bd;border-radius:15px;padding:15px;margin-top:17px;font-size:13px;line-height:1.7;color:#655937}.side{display:grid;gap:14px}.mini{padding:18px 20px}.mini-title{font-size:13px;color:var(--muted);font-weight:800}.money{font-size:28px;font-weight:950;margin-top:5px;letter-spacing:-.03em}.meter{height:8px;background:#edf0e8;border-radius:9px;margin-top:12px;overflow:hidden}.meter>i{display:block;height:100%;width:0;background:var(--green);border-radius:9px;transition:width .4s}.days{display:flex;gap:5px;margin-top:10px}.days i{height:7px;flex:1;background:#e9e8de;border-radius:4px}.days i.done{background:#80b46b}.notice{font-size:13px;line-height:1.65;color:#4c6254}.game-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:17px}.day-pill{border-radius:30px;padding:8px 12px;background:#eaf4dd;color:var(--green);font-weight:900;font-size:13px;white-space:nowrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:17px 0}.stat{background:#f7f7ef;border-radius:14px;padding:12px}.stat small{display:block;color:var(--muted);font-size:11px}.stat strong{display:block;font-size:18px;margin-top:4px}.price-wrap{display:flex;gap:9px;align-items:center}.price-wrap input{max-width:130px}.price-note{font-size:12px;color:var(--muted)}.stockline{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.stockline:last-child{border:0}.stockline strong{display:block}.stockline small{color:var(--muted)}.stepper{display:flex;align-items:center;gap:10px}.stepper button{width:31px;height:31px;border:0;border-radius:10px;background:#eaf2e2;color:var(--green);font-size:18px;font-weight:900}.stepper span{font-weight:900;min-width:18px;text-align:center}.feed{background:#f5f7ef;border-radius:14px;padding:13px 15px;min-height:56px;line-height:1.7;font-size:13px;color:#526357}.message{background:#fff4d8;padding:12px 14px;border-radius:13px;margin:14px 0;font-size:13px;line-height:1.65}.green{color:var(--green);font-weight:900}.red{color:var(--red);font-weight:900}.result{text-align:center;padding:10px}.result .big{font-size:55px}.result h2{font-size:27px}.hidden{display:none!important}.foot{text-align:center;color:#8a9287;font-size:11px;margin-top:20px}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);background:#25382e;color:white;padding:12px 17px;border-radius:13px;opacity:0;transition:.2s;pointer-events:none;z-index:5}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:760px){.layout{grid-template-columns:1fr}.hero{padding:23px}.hero-art{font-size:56px}.side{grid-template-columns:1fr 1fr}.side .mini:first-child{grid-column:span 2}}@media(max-width:480px){.shell{padding:14px 12px 30px}.top-note{display:none}.hero-art{display:none}.card{padding:18px}.biz-grid{gap:7px}.biz{padding:13px 9px}.biz strong{font-size:13px}.stats{gap:6px}.stat{padding:10px 8px}.stat strong{font-size:16px}.side{grid-template-columns:1fr}.side .mini:first-child{grid-column:auto}}
</style>
</head>
<body>
<div class="shell">
<header class="top"><div class="brand"><span class="brand-icon">🪙</span>小小商店老闆</div><div class="top-note">玩遊戲，學會讓每一塊錢都有好安排</div></header>
<section class="hero"><div class="hero-copy"><div class="eyebrow">生活理財 × 經營挑戰</div><h1>今天開店，明天更有本！</h1><p>照顧好自己、準備好商品，想想價格怎麼訂。每天的選擇，都會影響你的店和存款喔！</p></div><div class="hero-art" aria-hidden="true">🏪</div></section>
<main class="layout"><section class="card" id="mainCard"></section><aside class="side"><div class="card mini"><div class="mini-title">🏦 我的存款</div><div class="money" id="savings">$0</div><div class="meter"><i id="saveMeter"></i></div><div class="mini-title" style="margin-top:9px">存款目標 $500</div></div><div class="card mini"><div class="mini-title">📅 經營進度</div><div class="money" style="font-size:20px" id="dayCount">尚未開始</div><div class="days" id="dayDots"></div></div><div class="card mini"><div class="mini-title">💡 老闆小提醒</div><div class="notice" id="tip">先挑一家喜歡的店。做生意要顧成本，賺到的錢也可以先存起來。</div></div></aside></main>
<div class="foot">本遊戲為理財教育模擬體驗，遊戲金額不代表真實投資建議。</div>
</div><div class="toast" id="toast"></div>
<script>
(()=>{
const businesses={drink:{name:'飲料店',emoji:'🧋',product:'飲料',unit:'杯',cost:8,base:20,icon:'🧋',desc:'調配飲料，練習抓材料成本'},stationery:{name:'文具店',emoji:'✏️',product:'文具組',unit:'組',cost:10,base:24,icon:'✏️',desc:'準備文具，幫客人找到需要的用品'},farm:{name:'小農場',emoji:'🌱',product:'蔬菜籃',unit:'籃',cost:7,base:18,icon:'🥬',desc:'照顧作物，收成後拿去販售'}};
const fresh=()=>({stage:'setup',biz:null,name:'小老闆',day:1,cash:300,savings:0,stock:0,price:0,market:null,history:[],last:null,prep:{life:true,qty:5}});let s=fresh();
const $=id=>document.getElementById(id), money=n=>'$'+Math.round(n).toLocaleString('zh-TW');
function save(){try{localStorage.setItem('littleShopSave',JSON.stringify(s))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem('littleShopSave'));if(d&&d.biz&&d.stage!=='setup')s=d}catch(e){}}
function toast(t){const x=$('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1900)}
function render(){ $('savings').textContent=money(s.savings);$('saveMeter').style.width=Math.min(100,s.savings/5)+'%';$('dayCount').textContent=s.stage==='setup'?'尚未開始':s.day>7?'7 天完成':`第 ${Math.min(s.day,7)} 天 / 共 7 天`;$('dayDots').innerHTML=Array.from({length:7},(_,i)=>`<i class="${i<s.history.length?'done':''}"></i>`).join('');if(s.stage==='setup')setup();else if(s.stage==='open')openShop();else if(s.stage==='close')closeDay();else if(s.stage==='prep')prep();else ending();save()}
function setup(){ $('mainCard').innerHTML=`<h2>選一家你想經營的店</h2><p class="sub">你有 $300 開店基金。第一天的生活必需品和基本商品材料由遊戲提供。</p><div class="biz-grid">${Object.entries(businesses).map(([k,b])=>`<button class="biz ${s.biz===k?'selected':''}" data-biz="${k}"><span class="emoji">${b.emoji}</span><strong>${b.name}</strong><small>${b.desc}</small></button>`).join('')}</div><div class="field"><label for="playerName">幫小老闆取個名字</label><input id="playerName" maxlength="12" placeholder="例如：小安" value="${s.name==='小老闆'?'':s.name}"></div><div class="rules"><b>🎒 第一天的起步禮物</b><br>生活必需品已準備好，店裡也有 5 ${s.biz?businesses[s.biz].unit:'份'}基本商品。不用花開店基金就能開始營業！<br><b>每天打烊後</b>，記得花錢買隔天的生活用品和店裡材料；剩下的錢可以存進銀行。</div><button class="btn full" id="startBtn" ${s.biz?'':'disabled'}>開始第一天營業　→</button>`;document.querySelectorAll('[data-biz]').forEach(b=>b.onclick=()=>{s.biz=b.dataset.biz;render()});$('startBtn').onclick=()=>{s.name=$('playerName').value.trim()||'小老闆';s.stock=5;s.price=businesses[s.biz].base;s.market=market();s.stage='open';render()}}
function market(){return 5+Math.floor(Math.random()*5)}
function openShop(){const b=businesses[s.biz];$('mainCard').innerHTML=`<div class="game-head"><div><h2>${b.emoji} ${s.name}的${b.name}</h2><p class="sub" style="margin:4px 0 0">招呼客人、賣出商品，今天就能開張！</p></div><span class="day-pill">第 ${s.day} 天</span></div><div class="stats"><div class="stat"><small>手邊現金</small><strong>${money(s.cash)}</strong></div><div class="stat"><small>商品庫存</small><strong>${s.stock} ${b.unit}</strong></div><div class="stat"><small>今日預估客人</small><strong>${s.market} 位</strong></div></div><div class="field"><label>設定售價（每${b.unit}）</label><div class="price-wrap"><input id="price" type="number" min="1" max="99" value="${s.price}"><span class="price-note">材料成本約 ${money(b.cost)}／${b.unit}。價格太高，客人可能會變少喔！</span></div></div><div class="message">🔎 想一想：售價比材料成本高，才有機會賺錢；但定價太高，客人也可能不買。</div><button class="btn full" id="sellBtn">開始營業，看看今天生意如何！</button>`;$('sellBtn').onclick=sell}
function sell(){let p=Math.max(1,Math.min(99,Math.round(Number($('price').value)||1)));s.price=p;const b=businesses[s.biz];let demand=Math.max(0,s.market+Math.round((b.base-p)/3)+(Math.random()<.48?1:0));let sold=Math.min(s.stock,demand);let revenue=sold*p;let cost=sold*b.cost;let profit=revenue-cost;s.stock-=sold;s.cash+=revenue;s.last={sold,revenue,cost,profit,demand,price:p};s.stage='close';render()}
function closeDay(){const b=businesses[s.biz],x=s.last;$('mainCard').innerHTML=`<div class="game-head"><div><h2>🌇 第 ${s.day} 天打烊囉</h2><p class="sub" style="margin:4px 0 0">${x.sold?`今天賣出了 ${x.sold} ${b.unit}！`:'今天沒有賣出商品，明天再試試看！'}</p></div><span class="day-pill">今日結算</span></div><div class="stats"><div class="stat"><small>賣出收入</small><strong>${money(x.revenue)}</strong></div><div class="stat"><small>商品成本</small><strong>${money(x.cost)}</strong></div><div class="stat"><small>今日盈虧</small><strong class="${x.profit>=0?'green':'red'}">${x.profit>=0?'+':''}${money(x.profit)}</strong></div></div><div class="feed">${x.profit>=0?`🎉 這次的商品毛利是 ${money(x.profit)}。毛利是收入扣掉商品材料成本。`:`🧭 這次商品收入比材料成本少 ${money(-x.profit)}。可以想想下次怎麼調整價格。`}<br>商品售價 ${money(x.price)} × 賣出 ${x.sold} ${b.unit} = 收入 ${money(x.revenue)}。</div><div class="field"><label>把現金存進存款（可留一些現金買明天用品）</label><div class="price-wrap"><input id="deposit" type="number" min="0" max="${s.cash}" value="0"><span class="price-note">目前存款 ${money(s.savings)}，現金 ${money(s.cash)}</span></div></div><button class="btn full" id="saveBtn">存好，準備明天用品 →</button>`;$('saveBtn').onclick=()=>{let amount=Math.max(0,Math.min(s.cash,Math.round(Number($('deposit').value)||0)));s.cash-=amount;s.savings+=amount;s.history.push(s.last);s.stage=s.day>=7?'finish':'prep';render()}}
function prep(){const b=businesses[s.biz],qty=s.prep.qty,goodsCost=qty*b.cost,lifeCost=40,total=goodsCost+lifeCost,can=s.cash>=total; $('mainCard').innerHTML=`<div class="game-head"><div><h2>🧺 打烊採買時間</h2><p class="sub" style="margin:4px 0 0">為第 ${s.day+1} 天準備生活用品和商品材料。</p></div><span class="day-pill">明日備貨</span></div><div class="message">📌 每天的生活必需品要 ${money(lifeCost)}。先顧好生活，再準備商品，看看現金夠不夠用。</div><div class="stockline"><div><strong>🥪 生活必需品</strong><small>一天份，讓${s.name}有精神</small></div><button class="btn secondary" id="lifeToggle">必買　$40</button></div><div class="stockline"><div><strong>${b.icon} ${b.product}材料</strong><small>${money(b.cost)} 可製作 1 ${b.unit}</small></div><div class="stepper"><button id="minus" aria-label="減少">−</button><span>${qty}</span><button id="plus" aria-label="增加">+</button></div></div><div class="stats"><div class="stat"><small>本次採買</small><strong>${money(total)}</strong></div><div class="stat"><small>手邊現金</small><strong>${money(s.cash)}</strong></div><div class="stat"><small>採買後剩下</small><strong class="${s.cash-total>=0?'green':'red'}">${money(s.cash-total)}</strong></div></div><div class="feed">${can?'好好安排預算，明天就能繼續營業！':'目前現金不夠買這些用品。減少材料數量，或回頭檢查今天的存款金額。'}</div><button class="btn full" id="buyBtn" ${can?'':'disabled'}>確認採買，前往第 ${s.day+1} 天 →</button><button class="btn secondary full" style="margin-top:11px" id="depositMore">調整存款（取出一些現金）</button>`;$('lifeToggle').disabled=true;$('minus').onclick=()=>{s.prep.qty=Math.max(1,s.prep.qty-1);render()};$('plus').onclick=()=>{s.prep.qty=Math.min(30,s.prep.qty+1);render()};$('buyBtn').onclick=()=>{s.cash-=total;s.stock+=qty;s.day++;s.prep={life:true,qty:Math.max(3,Math.min(6,qty))};s.market=market();s.price=b.base;s.stage='open';render()};$('depositMore').onclick=()=>{const n=Number(prompt(`輸入要從存款取出的金額（最多 ${money(s.savings)}）`,Math.min(50,s.savings)));if(Number.isFinite(n)&&n>0){const a=Math.min(s.savings,Math.round(n));s.savings-=a;s.cash+=a;render()}}}
function ending(){const total=s.cash+s.savings,score=s.savings>=500?'儲蓄達人':total>=400?'用心小老闆':total>=300?'勇敢的創業家':'不怕失敗的學習家';$('mainCard').innerHTML=`<div class="result"><div class="big">${s.savings>=500?'🏆':'🎉'}</div><div class="eyebrow">七天挑戰完成</div><h2>${s.name}，你做到了！</h2><p class="sub">你經營了七天的${businesses[s.biz].name}，每一天都學到新本領。</p><div class="stats" style="text-align:left"><div class="stat"><small>最後存款</small><strong>${money(s.savings)}</strong></div><div class="stat"><small>手邊現金</small><strong>${money(s.cash)}</strong></div><div class="stat"><small>總資產</small><strong>${money(total)}</strong></div></div><div class="message"><b>${score}</b><br>理財不是每天都賺錢，而是學會安排需要的花費、控制成本、好好存錢。遇到虧損也能從經驗中調整！</div><h3>你的七日營業紀錄</h3><div class="feed" style="text-align:left">${s.history.map((h,i)=>`第 ${i+1} 天：售出 ${h.sold} 件，盈虧 <b class="${h.profit>=0?'green':'red'}">${h.profit>=0?'+':''}${money(h.profit)}</b>`).join('<br>')}</div><button class="btn full" id="restart">再玩一次</button></div>`;$('restart').onclick=()=>{localStorage.removeItem('littleShopSave');s=fresh();render()}}
load();render();
})();
</script>
</body>
</html>
